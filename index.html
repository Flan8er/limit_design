<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <link data-trunk rel="tailwind-css" href="/style/globals.css" />
    <link data-trunk rel="copy-dir" href="public" data-target-path="static" />
    <link
      rel="icon"
      type="image/png"
      href="/static/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="shortcut icon" href="/static/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/static/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="Casey Vaughn" />
    <link rel="manifest" href="/static/site.webmanifest" />

    <link data-trunk rel="copy-dir" href="assets" />
    <base href="/" />

    <title>Simulation and Dynamics Engineer - CASEY VAUGHN</title>
  </head>

  <style>
      #loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 1rem;
      }

      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #ffffff20;
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .loading-text {
        color: #ffffff80;
        font-family: monospace;
        font-size: 0.85rem;
        letter-spacing: 0.1em;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <div id="loading">
      <div class="spinner"></div>
      <span class="loading-text">LOADING</span>
    </div>
  </body>
</html>
